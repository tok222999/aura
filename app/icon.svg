<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6b55df" />
    </linearGradient>
    <linearGradient id="auraCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1830" />
      <stop offset="100%" stop-color="#0a0c13" />
    </linearGradient>
    <linearGradient id="barGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6b55df" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura Violet offset shadow tile -->
  <rect x="7" y="7" width="48" height="48" rx="14" fill="url(#auraGlow)" />

  <!-- Dark front shield tile -->
  <rect x="5" y="5" width="48" height="48" rx="13" fill="url(#auraCard)" filter="url(#shadow)" stroke="#4c3a8e" stroke-width="1.2" />

  <!-- Aura Slanted Privacy Signal Bars -->
  <path d="M16 26L34 20" stroke="url(#barGlow)" stroke-width="3.8" stroke-linecap="round" />
  <path d="M16 34L42 25.5" stroke="#a78bfa" stroke-width="3.8" stroke-linecap="round" />
  <path d="M16 42L34 36" stroke="url(#barGlow)" stroke-width="3.8" stroke-linecap="round" />

  <!-- Active Shielded Dot Indicator -->
  <circle cx="43" cy="18" r="3.2" fill="#009966" stroke="#0a0c13" stroke-width="1.2" />
</svg>
